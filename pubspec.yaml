name: easytier_gui
description: "A modern, beautiful Flutter GUI for EasyTier decentralized mesh VPN."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 本地持久化与路径
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # 工具类
  intl: ^0.19.0
  file_picker: ^8.1.2
  archive: ^4.5.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
